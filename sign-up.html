<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Join us</title>
</head>

<body>
    <div class="image">
        <div class="logo-container">
            <img class="logo" src="src/odin-lined.png" alt="">
            <div class="logo-title">ODIN</div>
        </div>
        <div class="credits">
            Photo by <a
                href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie
                West</a> on <a
                href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
        </div>

    </div>
    <div class="form-container">
        <div class="speech">
            <p>This is not a real online service! You know you need something like this in your life to help you realize
                your deepest dreams. Signup <span>now</span> to get started.</p>
            <p>You <span>know</span> you want to.</p>
        </div>
       <form id="sign-up-form" class="sign-up-form" method="get">
        <p>Let's do this!</p>
        <div class="inputs-container">
            <div class="first-name">
                <label for="first-name">First name</label>
                <input type="text" name="first-name" id="first-name">
            </div>
            <div class="last-name">
                <label for="last-name">Last name</label>
                <input type="text" name="last-name" id="last-name">
            </div>
            <div class="email">
                <label for="email">Email</label>
                <input type="email" name="email" id="email">
            </div>
            <div class="phone">
                <label for="phone">Phone number</label>
                <input type="tel" name="phone" id="phone">
            </div>
            <div class="password">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            <div class="password confirm">
                <label for="confirm">Confirm password</label>
                <input type="password" name="confirm" id="confirm" required>
            </div>
        </div>
    </form>
    
            <button type="submit" form="sign-up-form">Create Account</button>
    <div class="form-footer">Already have an account? <a href="#">Log in</a></div>
    </div>

</body>

</html>
